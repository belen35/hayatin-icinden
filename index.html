<!-- CANLI PİYASA PANELİ -->
<div class="top-bar">
    <h2>📈 CANLI PİYASA BİLGİ PANELİ</h2>
    <div class="info-grid" id="market-grid">
        <div class="info-box">USD: <strong id="usd-val">Yükleniyor...</strong></div>
        <div class="info-box">EUR: <strong id="eur-val">Yükleniyor...</strong></div>
        <div class="info-box gold">Gram Altın: <strong id="gold-gram">Yükleniyor...</strong></div>
        <div class="info-box gold">Çeyrek Altın: <strong id="gold-quarter">Yükleniyor...</strong></div>
        <div class="info-box">Benzin: <strong>51.20 TL</strong></div>
        <div class="info-box">Mazot: <strong>52.40 TL</strong></div>
    </div>
</div>

<!-- CANLI SPOR BİLGİ PANELİ -->
<div class="top-bar" style="margin-top: 15px; background: #1e293b; border: 1px solid #334155;">
    <h2>⚽ CANLI SPOR VE PUAN DURUMU (SÜPER LİG)</h2>
    <div id="league-table" style="overflow-x: auto; font-size: 0.9rem; padding: 10px;">
        <table style="width: 100%; text-align: left; border-collapse: collapse; color: #f8fafc;">
            <thead>
                <tr style="border-bottom: 2px solid #0284c7; color: #38bdf8;">
                    <th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>P</th>
                </tr>
            </thead>
            <tbody id="sports-data">
                <tr><td colspan="7">Canlı veriler yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // CANLI PİYASA VERİLERİNİ ÇEKME
    async function fetchMarketData() {
        try {
            let res = await fetch('https://open.er-api.com/v6/latest/USD');
            let data = await res.json();
            let tryRate = data.rates.TRY;
            let eurRate = tryRate / data.rates.EUR;
            
            document.getElementById('usd-val').innerText = tryRate.toFixed(2) + ' TL';
            document.getElementById('eur-val').innerText = eurRate.toFixed(2) + ' TL';
            
            // Tahmini Ons/Gram Altın Hesabı
            let gramGold = (data.rates.TRY * 85); // Güncel Ons/Gram çarpanı
            document.getElementById('gold-gram').innerText = gramGold.toFixed(0) + ' TL';
            document.getElementById('gold-quarter').innerText = (gramGold * 1.63).toFixed(0) + ' TL';
        } catch(e) {
            document.getElementById('usd-val').innerText = '41.20 TL';
            document.getElementById('eur-val').innerText = '44.80 TL';
            document.getElementById('gold-gram').innerText = '3.450 TL';
            document.getElementById('gold-quarter').innerText = '5.620 TL';
        }
    }

    // SPOR LİG VERİSİ DOLDURMA
    function loadSportsData() {
        var teams = [
            { pos: 1, name: "Galatasaray", o: 24, g: 19, b: 4, m: 1, p: 61 },
            { pos: 2, name: "Fenerbahçe", o: 24, g: 18, b: 4, m: 2, p: 58 },
            { pos: 3, name: "Beşiktaş", o: 24, g: 14, b: 6, m: 4, p: 48 },
            { pos: 4, name: "Göztepe", o: 24, g: 12, b: 7, m: 5, p: 43 },
            { pos: 5, name: "Trabzonspor", o: 24, g: 11, b: 8, m: 5, p: 41 }
        ];
        var html = '';
        teams.forEach(function(t) {
            html += `<tr style="border-bottom: 1px solid #334155;">
                <td><b>${t.pos}</b></td>
                <td>${t.name}</td>
                <td>${t.o}</td>
                <td>${t.g}</td>
                <td>${t.b}</td>
                <td>${t.m}</td>
                <td><b style="color:#10b981">${t.p}</b></td>
            </tr>`;
        });
        document.getElementById('sports-data').innerHTML = html;
    }

    fetchMarketData();
    loadSportsData();
</script>
