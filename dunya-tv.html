<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dünyadan İstediğin TV Kanalını İzle - Hayatın İçinden</title>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --border-color: #e2e8f0;
      --primary-color: #ef4444;
      --card-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    [data-theme="dark"] {
      --bg-color: #12181f;
      --card-bg: #1e293b;
      --text-color: #f1f5f9;
      --border-color: #334155;
      --card-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color); color: var(--text-color);
      display: flex; flex-direction: column; overflow: hidden;
    }

    .header-bar {
      height: 60px; background: var(--card-bg); display: flex;
      justify-content: space-between; align-items: center; padding: 0 16px;
      border-bottom: 1px solid var(--border-color); box-shadow: var(--card-shadow); z-index: 10;
    }

    .back-btn {
      text-decoration: none; color: #fff; background-color: var(--primary-color);
      padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 13px;
      transition: opacity 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .back-btn:hover { opacity: 0.9; }

    .external-btn {
      text-decoration: none; color: var(--text-color); background: rgba(0,0,0,0.05);
      padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border-color);
    }

    .iframe-container { flex: 1; width: 100%; height: calc(100% - 60px); position: relative; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="header-bar">
    <a href="index.html" class="back-btn">⬅️ Ana Sayfaya Dön</a>
    <h1 style="margin:0; font-size:16px; color:var(--primary-color);">🌍 Dünyadan İstediğin TV Kanalını İzle</h1>
    <a href="https://tvgarden.world/tv" target="_blank" class="external-btn">🔗 Tam Ekran / Harici Aç</a>
  </div>

  <div class="iframe-container">
    <iframe src="https://tvgarden.world/tv" title="Dünya TV Kanalları" allowfullscreen></iframe>
  </div>

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</body>
</html>
